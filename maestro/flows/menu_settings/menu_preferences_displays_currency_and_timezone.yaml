# Deliverable: Menu/Settings flows automated (Phase 3, Priority 2)
# Scope note: this asserts display only - the currency/timezone spinners and
# Save button are not exercised. Changing them modifies persistent account
# preferences on this live account; given the Contacts-favorite regression
# already found this session (a single innocuous-looking toggle broke the
# whole Contacts list), an unnecessary write action here wasn't worth the risk
# for a Low-priority display case. Revisit if an actual change/revert test is
# wanted later.

appId: com.eligeafrica.ambia
---
- runFlow: ../../subflows/launch_and_reach_menu.yaml
- runFlow: ../../subflows/assert_menu_loaded.yaml

- tapOn: "Preferences"
- assertVisible:
    id: "currency"
- assertVisible:
    id: "time_zone"
- assertVisible:
    id: "save"

- stopApp
- runFlow: ../../subflows/launch_and_reach_home.yaml
- runFlow: ../../subflows/assert_home_loaded.yaml
